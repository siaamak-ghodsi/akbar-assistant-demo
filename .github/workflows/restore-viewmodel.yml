name: Restore AssistantViewModel
on:
  workflow_dispatch:
  push:
    paths:
      - ".restore/**"
      - ".github/workflows/restore-viewmodel.yml"
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble ViewModel from parts
        run: |
          set -euo pipefail
          dest="app/src/main/java/com/akbar/assistant/demo/AssistantViewModel.kt"
          cat .restore/AssistantViewModel.part0 \
              .restore/AssistantViewModel.part1 \
              .restore/AssistantViewModel.part2 \
              .restore/AssistantViewModel.part3 > "$dest"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path("app/src/main/java/com/akbar/assistant/demo/AssistantViewModel.kt")
          t = p.read_text()
          assert "wasHandoff" in t
          assert "clearReturnNotifications" in t
          assert "Do not endHandoff here" in t
          assert "Keep handoff/return alive" in t
          assert "Lifecycle aborted TTS mid-flight" in t
          assert hashlib.sha256(t.encode()).hexdigest() == "bfc568fe4140f26e998cf6113134ec0dd78e51b01b8d87d5b1e9167e3f18bc0e"
          assert len(t) == 30244
          print("ViewModel OK", len(t))
          PY
          rm -rf .restore || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git commit -m "[release] Restore multi-command session + Camera/Gmail voice return (v1.9.5)"
          git push
