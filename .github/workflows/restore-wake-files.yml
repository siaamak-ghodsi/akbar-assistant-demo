name: Restore wake-word large files

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/staging/**'
      - '.github/workflows/restore-wake-files.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/wake-intel-tech-4d15
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reassemble and commit large files
        run: |
          set -euo pipefail
          restore_one() {
            local dest="$1"; shift
            local expect_sha="$1"; shift
            local tmp
            tmp=$(mktemp)
            cat "$@" | tr -d '\n' | base64 -d > "$tmp"
            actual=$(sha256sum "$tmp" | awk '{print $1}')
            echo "dest=$dest expect=$expect_sha actual=$actual"
            test "$actual" = "$expect_sha"
            mkdir -p "$(dirname "$dest")"
            mv "$tmp" "$dest"
          }
          restore_one "app/src/main/java/com/akbar/assistant/demo/commands/CommandParser.kt" "9157a6d68bf8a0fb7a46cb2445d9139eb30a141f6043610ccd1070e94ef6e986" ".github/staging/CommandParser.kt.0.b64" ".github/staging/CommandParser.kt.1.b64" ".github/staging/CommandParser.kt.2.b64" ".github/staging/CommandParser.kt.3.b64" ".github/staging/CommandParser.kt.4.b64"
          restore_one "app/src/main/java/com/akbar/assistant/demo/AssistantViewModel.kt" "17054e94fbb75562190f77a47943dcdc09164cd96e86b559abed3418f42e2d2d" ".github/staging/AssistantViewModel.kt.0.b64" ".github/staging/AssistantViewModel.kt.1.b64" ".github/staging/AssistantViewModel.kt.2.b64" ".github/staging/AssistantViewModel.kt.3.b64" ".github/staging/AssistantViewModel.kt.4.b64" ".github/staging/AssistantViewModel.kt.5.b64"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/akbar/assistant/demo/commands/CommandParser.kt \
                  app/src/main/java/com/akbar/assistant/demo/AssistantViewModel.kt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "[release] Change wake word to هی اینتل تک / Hey intel tech (v1.9.6) — restore large files"
            git push origin HEAD:cursor/wake-intel-tech-4d15
          fi
