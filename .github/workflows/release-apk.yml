name: Release intel tech APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag name
        required: false
        default: v1.9.2
  push:
    tags:
      - 'v*'
    branches:
      - main

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.9.2') }}
          name: intel tech Demo v1.9.2
          body: |
            Debug APK for the **intel tech** smart-board demo.

            - App name & icon: **intel tech**
            - Wake: «هی اکبر» / Hey Akbar
            - Commands: time, weather, flashlight, **camera on/off**, **Gmail open/close**
            - 120s session after wake
            - Closing camera/Gmail returns to the demo via handoff (mic FGS + PendingIntent; Android cannot kill other apps)

            Install: download `app-debug.apk`, allow unknown sources, open APK.
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
